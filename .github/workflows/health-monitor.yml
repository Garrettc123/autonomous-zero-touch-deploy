name: Multi-System Health Monitor

on:
  schedule:
    - cron: '0 */4 * * *'   # Every 4 hours
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

jobs:
  health-check:
    name: System Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Supabase health
        id: supabase
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "status=skip" >> $GITHUB_OUTPUT; exit 0; fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Supabase: $STATUS"

      - name: Stripe health
        id: stripe
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then echo "status=skip" >> $GITHUB_OUTPUT; exit 0; fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -H "Authorization: Bearer $STRIPE_SECRET_KEY" \
            https://api.stripe.com/v1/balance || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Stripe: $STATUS"

      - name: Linear health
        id: linear
        run: |
          if [ -z "$LINEAR_API_KEY" ]; then echo "status=skip" >> $GITHUB_OUTPUT; exit 0; fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"query":"{viewer{id}}"}' || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Linear: $STATUS"

      - name: Notion health
        id: notion
        run: |
          if [ -z "$NOTION_TOKEN" ]; then echo "status=skip" >> $GITHUB_OUTPUT; exit 0; fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            https://api.notion.com/v1/users/me || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Notion: $STATUS"

      - name: Flag degraded systems as GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const checks = {
              Supabase: '${{ steps.supabase.outputs.status }}',
              Stripe:   '${{ steps.stripe.outputs.status }}',
              Linear:   '${{ steps.linear.outputs.status }}',
              Notion:   '${{ steps.notion.outputs.status }}'
            }
            const failed = Object.entries(checks)
              .filter(([k,v]) => v !== '200' && v !== '404' && v !== 'skip')
              .map(([k,v]) => `- **${k}**: HTTP ${v}`)
            if (failed.length > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `⚠️ Health check degraded — ${new Date().toISOString().split('T')[0]}`,
                body: [
                  '### Degraded Systems',
                  ...failed,
                  '',
                  `**Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                  `**Time:** ${new Date().toISOString()}`
                ].join('\n'),
                labels: ['health-check', 'automated']
              })
            } else {
              console.log('All systems healthy')
            }
