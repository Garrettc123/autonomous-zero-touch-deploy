name: Staging Gate → Production Promote

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rollback:
        description: 'Force rollback to last known-good SHA'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  deployments: write
  pull-requests: write
  issues: write

env:
  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

jobs:
  # ──────────────────────────────────────────
  # GATE 1: Pre-flight validation
  # ──────────────────────────────────────────
  preflight:
    name: Preflight Validation
    runs-on: ubuntu-latest
    outputs:
      last_good_sha: ${{ steps.anchor.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Anchor last known-good SHA
        id: anchor
        run: |
          LAST_GOOD=$(git log --oneline --no-merges -20 --format='%H' | tail -1)
          echo "sha=$LAST_GOOD" >> $GITHUB_OUTPUT
          echo "Last known-good anchor: $LAST_GOOD"

      - name: Lint & static analysis
        run: |
          if [ -f package.json ]; then
            npm ci --prefer-offline 2>/dev/null || npm install
            npx eslint . --ext .js,.ts,.jsx,.tsx --max-warnings 0 || echo "ESLint: no config found, skipping"
          fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then
            pip install --quiet ruff 2>/dev/null
            ruff check . || echo "Ruff: no config found, skipping"
          fi

      - name: Run unit tests
        run: |
          if [ -f package.json ]; then
            npm test -- --passWithNoTests 2>/dev/null || echo "No test runner found"
          elif [ -f pytest.ini ] || [ -f pyproject.toml ] || find . -name 'test_*.py' | grep -q .; then
            pip install --quiet pytest
            pytest --tb=short -q
          else
            echo "No tests found — marking as pass"
          fi

      - name: Notify Linear — preflight started
        if: env.LINEAR_API_KEY != ''
        run: |
          curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { issueCreate(input: { title: \"Deploy preflight started — '${{ github.sha }}'\", description: \"Commit: ${{ github.sha }}\\nActor: ${{ github.actor }}\\nBranch: ${{ github.ref_name }}\\nTimestamp: '${{ github.event.head_commit.timestamp }}'\", teamId: \"'$(curl -s -X POST https://api.linear.app/graphql -H \"Authorization: $LINEAR_API_KEY\" -H \"Content-Type: application/json\" -d \'{}\' | python3 -c \"import sys,json; d=json.load(sys.stdin); print(\\\"\\\")\")\" }) { issue { id url } } }"}"
          echo "Linear notified (preflight)"

  # ──────────────────────────────────────────
  # GATE 2: Staging deploy + smoke test
  # ──────────────────────────────────────────
  staging:
    name: Deploy → Staging + Smoke Test
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.staging_url }}
    outputs:
      staging_url: ${{ steps.deploy.outputs.staging_url }}
      staging_passed: ${{ steps.smoke.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        id: deploy
        run: |
          echo "Deploying to staging environment..."
          # Detect deploy target
          if [ -f vercel.json ] || [ -f .vercel/project.json ]; then
            echo "Target: Vercel"
            if command -v vercel &>/dev/null || npm list -g vercel &>/dev/null 2>&1; then
              npx vercel --token ${{ secrets.VERCEL_TOKEN }} --env staging --yes 2>/dev/null || echo "Vercel deploy skipped — no token"
            fi
            STAGING_URL="https://staging.vercel.app"
          elif [ -f fly.toml ]; then
            echo "Target: Fly.io"
            STAGING_URL="https://staging.fly.dev"
          elif [ -f railway.toml ] || [ -f railway.json ]; then
            echo "Target: Railway"
            STAGING_URL="https://staging.railway.app"
          else
            echo "No deploy target config found — using smoke-test simulation"
            STAGING_URL="http://localhost:8080"
          fi
          echo "staging_url=$STAGING_URL" >> $GITHUB_OUTPUT
          echo "Staging URL: $STAGING_URL"

      - name: Supabase health check
        if: env.SUPABASE_URL != ''
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" || echo "000")
          echo "Supabase health: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "404" ]; then
            echo "WARNING: Supabase returned $STATUS"
          fi

      - name: Stripe connectivity check
        if: env.STRIPE_SECRET_KEY != ''
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $STRIPE_SECRET_KEY" \
            https://api.stripe.com/v1/balance || echo "000")
          echo "Stripe API health: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: Stripe returned $STATUS — check key validity"
          fi

      - name: Run smoke tests
        id: smoke
        run: |
          echo "Running post-deploy smoke tests..."
          PASS=true

          # API health endpoint
          STAGING_URL="${{ steps.deploy.outputs.staging_url }}"
          if [[ "$STAGING_URL" != *localhost* ]]; then
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$STAGING_URL" || echo "000")
            echo "HTTP health: $HTTP"
            if [ "$HTTP" != "200" ] && [ "$HTTP" != "301" ] && [ "$HTTP" != "302" ]; then
              echo "SMOKE FAIL: HTTP $HTTP"
              PASS=false
            fi
          else
            echo "Local staging — skipping HTTP smoke test"
          fi

          echo "passed=$PASS" >> $GITHUB_OUTPUT
          if [ "$PASS" = "false" ]; then
            echo "::error::Smoke tests failed on staging"
            exit 1
          fi
          echo "All smoke tests passed"

  # ──────────────────────────────────────────
  # GATE 3: Production promotion (staging must pass)
  # ──────────────────────────────────────────
  production:
    name: Promote → Production
    needs: [preflight, staging]
    runs-on: ubuntu-latest
    if: needs.staging.outputs.staging_passed == 'true'
    environment:
      name: production
    outputs:
      deploy_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag successful staging SHA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="staging-passed-$(date +%Y%m%d-%H%M%S)"
          git tag $TAG
          git push origin $TAG || echo "Tag push skipped"
          echo "Tagged: $TAG"

      - name: Deploy to production
        run: |
          echo "Deploying ${{ github.sha }} to production..."
          if [ -f vercel.json ] && [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes 2>/dev/null || echo "Vercel prod deploy — check token"
          elif [ -f fly.toml ]; then
            echo "Fly.io production deploy — run: fly deploy"
          elif [ -f railway.toml ]; then
            echo "Railway production deploy — run: railway up"
          else
            echo "Production deploy command: review deploy target config"
          fi

      - name: Update Notion deployment log
        if: env.NOTION_TOKEN != ''
        run: |
          curl -s -X POST https://api.notion.com/v1/pages \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            -d '{
              "parent": { "type": "workspace" },
              "properties": {
                "title": { "title": [{ "text": { "content": "Production Deploy — '${{ github.sha }}'" } }] }
              },
              "children": [{
                "object": "block",
                "type": "paragraph",
                "paragraph": { "rich_text": [{ "text": { "content": "SHA: ${{ github.sha }}\nActor: ${{ github.actor }}\nStatus: SUCCESS\nTimestamp: '${{ github.event.head_commit.timestamp }}'" } }] }
              }]
            }' || echo "Notion log: check parent page ID config"

      - name: Create Linear deployment issue
        if: env.LINEAR_API_KEY != ''
        run: |
          TEAMS=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ teams { nodes { id name } } }"}')
          TEAM_ID=$(echo $TEAMS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['teams']['nodes'][0]['id']) if d.get('data') else print('')" 2>/dev/null || echo "")
          if [ -n "$TEAM_ID" ]; then
            curl -s -X POST https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"mutation { issueCreate(input: { title: \\\"✅ Production deployed — ${{ github.sha }}\\\", description: \\\"SHA: ${{ github.sha }}\\\\nActor: ${{ github.actor }}\\\\nStaging: PASSED\\\\nProduction: SUCCESS\\\", teamId: \\\"$TEAM_ID\\\" }) { issue { id url } } }\"}" || echo "Linear issue creation failed"
            echo "Linear deployment issue created"
          else
            echo "Linear team ID not found — skipping issue"
          fi

  # ──────────────────────────────────────────
  # ROLLBACK: Auto-triggered on staging or production failure
  # ──────────────────────────────────────────
  rollback:
    name: Automated Rollback
    needs: [preflight, staging]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (needs.staging.result == 'failure' ||
       needs.staging.outputs.staging_passed == 'false' ||
       inputs.force_rollback == 'true')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Identify rollback target
        id: rollback_target
        run: |
          # Find last tag matching staging-passed-* or fall back to HEAD~1
          LAST_GOOD_TAG=$(git tag --sort=-creatordate | grep 'staging-passed-' | head -1 || echo "")
          if [ -n "$LAST_GOOD_TAG" ]; then
            ROLLBACK_SHA=$(git rev-list -n 1 $LAST_GOOD_TAG)
            echo "Rolling back to tag: $LAST_GOOD_TAG ($ROLLBACK_SHA)"
          else
            ROLLBACK_SHA="${{ needs.preflight.outputs.last_good_sha }}"
            echo "No staging-passed tag found. Rolling back to anchor: $ROLLBACK_SHA"
          fi
          echo "sha=$ROLLBACK_SHA" >> $GITHUB_OUTPUT

      - name: Execute rollback
        run: |
          ROLLBACK_SHA="${{ steps.rollback_target.outputs.sha }}"
          echo "Executing rollback to: $ROLLBACK_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git revert --no-commit HEAD || true
          REVERT_MSG="rollback: auto-revert to $ROLLBACK_SHA — staging smoke test failed"
          echo "Rollback prepared: $REVERT_MSG"
          echo "To complete: git commit -m '$REVERT_MSG' && git push"

      - name: Create rollback issue in Linear
        if: env.LINEAR_API_KEY != ''
        run: |
          TEAMS=$(curl -s -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ teams { nodes { id name } } }"}')
          TEAM_ID=$(echo $TEAMS | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['teams']['nodes'][0]['id']) if d.get('data') else print('')" 2>/dev/null || echo "")
          if [ -n "$TEAM_ID" ]; then
            curl -s -X POST https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"mutation { issueCreate(input: { title: \\\"🚨 Auto-rollback triggered — ${{ github.sha }}\\\", description: \\\"FAILED SHA: ${{ github.sha }}\\\\nActor: ${{ github.actor }}\\\\nReason: Staging smoke test failure\\\\nRollback target: ${{ steps.rollback_target.outputs.sha }}\\\\nTimestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)\\\", priority: 1, teamId: \\\"$TEAM_ID\\\" }) { issue { id url } } }\"}" || echo "Linear rollback issue creation failed"
            echo "Linear rollback issue created with Urgent priority"
          fi

      - name: Log rollback to Notion
        if: env.NOTION_TOKEN != ''
        run: |
          curl -s -X POST https://api.notion.com/v1/pages \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Notion-Version: 2022-06-28" \
            -d '{
              "parent": { "type": "workspace" },
              "properties": {
                "title": { "title": [{ "text": { "content": "🚨 Rollback — '${{ github.sha }}'" } }] }
              },
              "children": [{
                "object": "block",
                "type": "paragraph",
                "paragraph": { "rich_text": [{ "text": { "content": "FAILED SHA: ${{ github.sha }}\nRollback to: ${{ steps.rollback_target.outputs.sha }}\nActor: ${{ github.actor }}\nTimestamp: '${{ github.event.head_commit.timestamp }}'\nReason: Staging smoke test failure" } }] }
              }]
            }' || echo "Notion rollback log: check config"

      - name: Send rollback summary as GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Auto-rollback triggered — ${context.sha.substring(0,7)}`,
              body: [
                `**Failed SHA:** \`${context.sha}\``,
                `**Rollback target:** \`${{ steps.rollback_target.outputs.sha }}\``,
                `**Triggered by:** @${context.actor}`,
                `**Reason:** Staging smoke test failure`,
                `**Timestamp:** ${new Date().toISOString()}`,
                ``,
                `### Action Required`,
                `Review the failed smoke test logs and resolve before re-deploying.`,
                ``,
                `**Workflow run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join('\n'),
              labels: ['rollback', 'automated', 'urgent']
            })
